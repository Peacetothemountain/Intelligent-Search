name: Set up Gradle
description: JDK 17 and Gradle with its cache, the same for every CI job.

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      with:
        # dev is where work lands, so it keeps the cache warm: unchanged tasks, such as all of them on a docs-only
        # commit, then come from the cache while the job still reports on that exact commit.
        cache-read-only: ${{ github.ref != 'refs/heads/dev' }}
        # Also checks the Gradle wrapper before anything runs.
        validate-wrappers: true

    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x gradlew
