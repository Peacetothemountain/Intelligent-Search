name: Set up Gradle
description: JDK 17 and Gradle with its cache, the same for every CI job.

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      with:
        # dev is where work lands, so it keeps the cache warm: unchanged tasks, such as all of them on a docs-only
        # commit, then come from the cache while the job still reports on that exact commit.
        cache-read-only: ${{ github.ref != 'refs/heads/dev' }}
        # Also checks the Gradle wrapper before anything runs.
        validate-wrappers: true

    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x gradlew
