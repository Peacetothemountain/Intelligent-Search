name: CI Check & Build

# Pushes run on dev only: main requires this job green on the exact commit, and a commit reaches main only after
# passing here (git push origin dev:main), so a run on main would repeat the same check on the same code.
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tests and the minified build run side by side: sharing one runner's four cores with R8 (510s) slowed the tests
  # from 398s to 649s.
  tests:
    name: Lint & Tests
    runs-on: ubuntu-latest
    # A normal run takes well under this; a hung test stops here instead of holding a runner for six hours.
    timeout-minutes: 45
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment) so a moved tag can't change the build.
      # Nothing here pushes, so the token isn't left in .git/config for the build's own code to read.
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: ./.github/actions/gradle

      # Robolectric downloads the Android runtime its tests run on (android-all, about 150 MB) into the local Maven
      # repository the first time; keep them between runs. A cache entry is never rewritten, so the key names every
      # SDK the tests ask for: adding one saves a new entry, instead of downloading it again on every run.
      - name: Read Robolectric version and test SDK
        id: robolectric
        run: |
          echo "version=$(sed -n 's/^robolectric = "\([^"]*\)".*/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
          echo "sdk=$(sed -n 's/^sdk=\([0-9]*\).*/\1/p' app/src/test/resources/robolectric.properties)" >> "$GITHUB_OUTPUT"
          echo "sdks=$(grep -rhoE 'sdk = \[[0-9, ]+\]' app/src/test --include=*.kt | grep -oE '[0-9]+' | sort -un | paste -sd- -)" >> "$GITHUB_OUTPUT"

      - name: Cache Robolectric's Android runtime
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ steps.robolectric.outputs.version }}-sdk${{ steps.robolectric.outputs.sdk }}-${{ steps.robolectric.outputs.sdks }}
          restore-keys: robolectric-${{ steps.robolectric.outputs.version }}-

      # Lint fails on warnings not in app/lint-baseline.xml.
      - name: Run lint and tests
        run: ./gradlew lintDebug testDebugUnitTest --no-daemon

      # On a failed screenshot comparison Roborazzi writes *_compare.png diffs here; keep them to look at.
      - name: Upload test reports and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-failures
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/outputs/roborazzi
          if-no-files-found: ignore

  minified:
    name: Minified Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: ./.github/actions/gradle

      # CI has no signing key, so this only proves the minified build compiles.
      - name: Build the release APK
        run: ./gradlew assembleRelease --no-daemon

  # main requires this check by name. GitHub counts a skipped job as passing, so it must always run and read the results
  # itself: without always() a failure above would skip it and let the commit through.
  check:
    name: Build & Check
    needs: [ tests, minified ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lint, tests and the minified build all passed
        run: |
          echo "tests: ${{ needs.tests.result }}, minified: ${{ needs.minified.result }}"
          test "${{ needs.tests.result }}" = success
          test "${{ needs.minified.result }}" = success
