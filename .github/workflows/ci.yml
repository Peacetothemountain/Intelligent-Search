name: CI Check & Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Check
    runs-on: ubuntu-latest
    # A normal run takes well under this; a hung test stops here instead of holding a runner for six hours.
    timeout-minutes: 45
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment) so a moved tag can't change the build.
      # Nothing here pushes, so the token isn't left in .git/config for the build's own code to read.
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Robolectric downloads the Android runtime its tests run on (android-all, about 150 MB) into the local Maven
      # repository the first time; keep it between runs. A new Robolectric version or test SDK needs a new one.
      - name: Read Robolectric version and test SDK
        id: robolectric
        run: |
          echo "version=$(sed -n 's/^robolectric = "\([^"]*\)".*/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
          echo "sdk=$(sed -n 's/^sdk=\([0-9]*\).*/\1/p' app/src/test/resources/robolectric.properties)" >> "$GITHUB_OUTPUT"

      - name: Cache Robolectric's Android runtime
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ steps.robolectric.outputs.version }}-sdk${{ steps.robolectric.outputs.sdk }}

      # Lint fails on warnings not in app/lint-baseline.xml. CI has no signing key, so assembleRelease here only
      # proves the minified build compiles.
      - name: Run Build & Check
        run: ./gradlew lintDebug testDebugUnitTest assembleRelease --no-daemon

      # On a failed screenshot comparison Roborazzi writes *_compare.png diffs here; keep them to look at.
      - name: Upload test reports and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-failures
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/outputs/roborazzi
          if-no-files-found: ignore
