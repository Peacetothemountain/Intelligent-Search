name: Declined

# The owner's "no": closing the pull request takes those changes back out of dev and records it, so they don't come back
# in the next pull request and aren't tried again. Uses no Claude.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  undo:
    if: >-
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          fetch-depth: 0

      - run: |
          git fetch --quiet origin main
          declined=$(git log origin/main..HEAD --no-merges --format='%s' | paste -sd ';' -)
          # Workflow files are left out: this token can't change them, and only the owner's commits can.
          git diff --binary HEAD origin/main -- . ':!.github' ':!docs/LEDGER.md' > undo.patch
          if [ -s undo.patch ]; then git apply --index --binary undo.patch; fi
          rm undo.patch
          marker='<!--'
          line=$(grep -n "^$marker" docs/LEDGER.md | tail -1 | cut -d: -f1)
          {
            echo "### $(date -u +%Y-%m-%d): Declined by the owner"
            echo "- Declined: $declined"
            echo '- Retry only if: the owner asks for them'
            echo
          } > entry.md
          sed -i "$((line - 1))r entry.md" docs/LEDGER.md
          rm entry.md
          git add docs/LEDGER.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m 'Undo declined changes'
          git push --quiet origin HEAD:dev
