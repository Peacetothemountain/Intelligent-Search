name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'

# Creating a release needs write access; everything else stays read-only.
permissions:
  contents: write

jobs:
  release:
    name: Build & Upload Release APK
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment) so a moved tag can't change the build.
      # The job's token can write to the repository and the build runs third-party Gradle code, so the token is not
      # left in .git/config; the release step gets it as its own input.
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The whole history, so the next step can tell whether the tagged commit is on main.
          fetch-depth: 0

      # main only takes commits that passed Build & Check, and this job runs no tests of its own: a tag on a commit
      # that isn't on main, or one carrying another version's number, would publish an untested or misnamed release
      # as Latest. Stop before building.
      - name: Check the tag is this version, on main
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9][0-9]*\)$/\1/p' app/build.gradle.kts)
          if [ -z "$name" ] || [ -z "$code" ] || [ "${GITHUB_REF_NAME#v}" != "$name-$code" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app's version, v$name-$code (app/build.gradle.kts)."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is on a commit that isn't on main, so it never passed Build & Check."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # build.gradle.kts signs with release.keystore at the repo root plus the RELEASE_* variables, and
      # produces an unsigned APK (a different file name) when any of them is missing, so stop here instead.
      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set; can't sign the release."
              exit 1
            fi
          done
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Name the APK like the earlier releases: tag v9.3.1-125 gives IntelligentSearch-9.3.1-125.apk.
      - name: Verify and name the signed APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/IntelligentSearch-${GITHUB_REF_NAME#v}.apk"
          # R8's mapping turns a minified crash trace (names like yy2.j) back into the app's own classes.
          cp app/build/outputs/mapping/release/mapping.txt "app/build/outputs/apk/release/IntelligentSearch-${GITHUB_REF_NAME#v}-mapping.txt"

      - name: Remove signing keystore
        if: always()
        run: rm -f release.keystore

      # Releases on a public repository are public.
      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            app/build/outputs/apk/release/IntelligentSearch-*.apk
            app/build/outputs/apk/release/IntelligentSearch-*-mapping.txt
          name: Intelligent Search ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
