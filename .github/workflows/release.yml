name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'

# Creating a release needs write access; everything else stays read-only.
permissions:
  contents: write

jobs:
  release:
    name: Build & Upload Release APK
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment) so a moved tag can't change the build.
      # The job's token can write to the repository and the build runs third-party Gradle code, so the token is not
      # left in .git/config; the release step gets it as its own input.
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # build.gradle.kts signs with release.keystore at the repo root plus the RELEASE_* variables, and
      # produces an unsigned APK (a different file name) when any of them is missing, so stop here instead.
      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set; can't sign the release."
              exit 1
            fi
          done
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Name the APK like the earlier releases: tag v9.3.1-125 gives IntelligentSearch-9.3.1-125.apk.
      - name: Verify and name the signed APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/IntelligentSearch-${GITHUB_REF_NAME#v}.apk"

      - name: Remove signing keystore
        if: always()
        run: rm -f release.keystore

      # Releases on a public repository are public.
      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: app/build/outputs/apk/release/IntelligentSearch-*.apk
          name: Intelligent Search ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
