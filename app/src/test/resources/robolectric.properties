# Plain Application: tests construct what they need instead of booting Hilt and App startup work.
application=android.app.Application
# Android 14: newer Robolectric runtimes need Java 21, the build uses Java 17. Within minSdk 31.
sdk=34
# Compose 1.13 draws mesh gradients with Android's Mesh, which Robolectric's graphics can't (MeshGradientRendererShadow).
instrumentedPackages=androidx.compose.ui.graphics.MeshGradientRenderer_androidKt
shadows=com.pixel.intelligentsearch.MeshGradientRendererShadow
